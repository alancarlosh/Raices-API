services:
  - type: web
    name: raices-api
    env: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py ensure_superuser &&
      python manage.py load_placeholder_audio_fixtures &&
      python manage.py seed_demo
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MEDIA_BASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      # CORREO. No hace falta ninguna libreria: django.core.mail viene con
      # Django y apps/accounts/services.py ya la usa. Lo unico que faltaba
      # era esto -- y faltaba de verdad: sin EMAIL_BACKEND el valor por
      # defecto es `console`, asi que en Render el enlace de recuperacion
      # se escribia en el LOG DEL SERVIDOR y no le llegaba a nadie. El
      # usuario veia "te enviamos un enlace", el enlace era valido, y no
      # aparecia nunca.
      #
      # EMAIL_HOST y EMAIL_PORT no se declaran: settings.py ya trae el
      # relay de Brevo (smtp-relay.brevo.com:587) por defecto.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      # Las credenciales SMTP de Brevo. OJO: el usuario y la clave SMTP
      # NO son el correo y la contrasena de la cuenta Brevo -- se sacan
      # de su panel, en SMTP & API. Van sync:false para que se escriban
      # en el panel de Render y no acaben en el repositorio.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Remitente. Tiene que ser una direccion VERIFICADA en Brevo o el
      # relay rechaza el envio.
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # La URL del frontend, que es con la que se arma el enlace del
      # correo (services.py: f"{FRONTEND_URL}/restablecer-password?...").
      # Si no se pone, el valor por defecto es http://localhost:8080 y
      # los enlaces que reciba la gente apuntarian A SU PROPIO ORDENADOR.
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: raices-db
          property: connectionString

databases:
  - name: raices-db
    plan: free
